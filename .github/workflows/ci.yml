name: CI

# Every push and every pull request into main: run the tests and check that
# the extension packages. The .vsix is kept as a build artifact for 14 days,
# so any commit can be installed and tried without building it locally.

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          package-manager-cache: false   # no dependencies, no lockfile

      - name: Run tests
        run: npm test

      - name: Package extension
        run: npx --yes @vscode/vsce@latest package --out nodeviz.vsix

      - uses: actions/upload-artifact@v7
        with:
          name: nodeviz-${{ github.sha }}
          path: nodeviz.vsix
          retention-days: 14

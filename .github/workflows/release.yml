name: Release

# Run by hand from main: Actions -> Release -> Run workflow, pick the bump.
#   1. runs the tests
#   2. bumps the version in package.json and turns "## Unreleased" in
#      CHANGELOG.md into that version (scripts/release/prepare.js);
#      stops if there are no notes
#   3. packages the .vsix
#   4. publishes it to the VS Code Marketplace with Trusted Publishing (OIDC),
#      so no token is stored anywhere
#   5. pushes the release commit and the tag vX.Y.Z to main
#   6. makes a GitHub release with the notes and the .vsix attached
#
# The Marketplace only accepts this file name: the Trusted Publishing policy
# on marketplace.visualstudio.com/manage points at "release.yml" in
# alexD1990/nodeviz. Renaming the file means updating the policy.

on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version bump (none = publish the version already in package.json)'
        type: choice
        options: [patch, minor, major, none]
        default: patch

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write   # push the release commit and tag, create the GitHub release
      id-token: write   # Marketplace Trusted Publishing
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0   # all tags, for the "already released?" check

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          package-manager-cache: false

      - name: Run tests
        run: npm test

      - name: Bump version and changelog
        run: node scripts/release/prepare.js "$BUMP"
        env:
          BUMP: ${{ inputs.bump }}

      - name: Check this version is not released yet
        run: |
          if git rev-parse -q --verify "refs/tags/v$RELEASE_VERSION" >/dev/null; then
            echo "::error::Tag v$RELEASE_VERSION already exists. Pick another bump."
            exit 1
          fi

      - name: Package
        run: npx --yes @vscode/vsce@latest package --out "nodeviz-$RELEASE_VERSION.vsix"

      - name: Commit and tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json CHANGELOG.md
          git diff --cached --quiet || git commit -m "Release v$RELEASE_VERSION"
          git tag -a "v$RELEASE_VERSION" -m "NodeViz $RELEASE_VERSION"

      - name: Publish to the VS Code Marketplace
        run: npx --yes @vscode/vsce@latest publish --oidc --packagePath "nodeviz-$RELEASE_VERSION.vsix"

      - name: Push release commit and tag
        run: git push --atomic origin HEAD:main "v$RELEASE_VERSION"

      - name: Create GitHub release
        run: |
          gh release create "v$RELEASE_VERSION" "nodeviz-$RELEASE_VERSION.vsix" \
            --title "NodeViz $RELEASE_VERSION" \
            --notes-file "$RELEASE_NOTES"
        env:
          GH_TOKEN: ${{ github.token }}
